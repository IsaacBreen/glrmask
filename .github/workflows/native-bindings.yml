name: Native C++ and Node.js
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  musl-stack-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Reproduce native musl stack failure with controlled stack probes
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -v "$RUNNER_TEMP:/runner_temp" -w /workspace \
            -e CARGO_TARGET_DIR=target/native-ci -e RUNNER_TEMP=/runner_temp -e GITHUB_WORKSPACE=/workspace \
            -e TARGET=x86_64-unknown-linux-musl -e TAG=linux-x64-musl node:22-alpine \
            sh -c 'apk add --no-cache bash && bash bindings/ci/build-linux-container.sh'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: musl-stack-diagnostic
          path: |
            ${{ runner.temp }}/cpp-validation/**/failure-backtrace.txt
            ${{ runner.temp }}/cpp-validation/**/stack-probe-*.txt
          if-no-files-found: error
          retention-days: 14
