name: Native C++ and Node.js

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, feat/native-cpp-js-881685]
    paths:
      - 'bindings/**'
      - 'src/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-bindings.yml'
  pull_request:
    paths:
      - 'bindings/**'
      - 'src/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-bindings.yml'

permissions:
  contents: read

concurrency:
  group: native-bindings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '3'
  CARGO_TARGET_DIR: target/native-ci
  PYTHONUTF8: '1'
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  native:
    name: Native / ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            tag: linux-x64-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
            linux: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            tag: linux-arm64-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
            linux: true
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            tag: linux-x64-musl
            container: node:22-alpine
            linux: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            tag: linux-arm64-musl
            container: node:22-alpine
            linux: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            tag: darwin-x64
            linux: false
          - os: macos-15
            target: aarch64-apple-darwin
            tag: darwin-arm64
            linux: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            tag: win32-x64-msvc
            msvc_arch: x64
            msvc_component: x86.x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            tag: win32-arm64-msvc
            msvc_arch: arm64
            msvc_component: ARM64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Build, test, validate and package in Linux container
        if: matrix.linux
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner_temp" \
            -w /workspace \
            -e "CARGO_TARGET_DIR=target/native-ci" \
            -e "RUNNER_TEMP=/runner_temp" \
            -e "GITHUB_WORKSPACE=/workspace" \
            -e "TARGET=${{ matrix.target }}" \
            -e "TAG=${{ matrix.tag }}" \
            ${{ matrix.container }} \
            sh -c "if [ -f /etc/alpine-release ]; then apk add --no-cache bash; fi && bash /workspace/bindings/ci/build-linux-container.sh"
      - uses: actions/setup-node@v6
        if: ${{ !matrix.linux }}
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        if: ${{ !matrix.linux }}
        with:
          python-version: '3.12'
      - name: Configure MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.${{ matrix.msvc_component }} -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=${{ matrix.msvc_arch }} -host_arch=${{ matrix.msvc_arch }}'
          # Git Bash prepends its own link.exe. Pin MSVC explicitly for Rust
          # (including host build scripts) and for CMake/cc-rs native compilers.
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $triple = '${{ matrix.target }}'.ToUpper().Replace('-', '_')
          "CARGO_TARGET_${triple}_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($name in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCINSTALLDIR','WindowsSdkDir','WindowsSDKVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Install build tools
        if: ${{ !matrix.linux }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add '${{ matrix.target }}'
          python -m pip install cmake ninja
          npm ci --omit=optional --ignore-scripts --prefix bindings/node
      - name: Validate source contracts
        if: ${{ !matrix.linux }}
        run: python bindings/ci/check.py
      - name: Build native release libraries
        if: ${{ !matrix.linux }}
        run: cargo build --release --locked -p glrmask-c -p glrmask-node --target '${{ matrix.target }}'
      - name: Build and test single-target Node addon
        if: ${{ !matrix.linux }}
        working-directory: bindings/node
        run: |
          npm run build -- --target '${{ matrix.target }}'
          npm run check
          npm test
          npm run typecheck
          node scripts/test-platform-artifact.cjs
      # Each native job uploads only a signed/checksummed target fragment;
      # the aggregate job stages all eight optional-dependency npm packages
      # and verifies the actual thin-root installed consumer.
      - name: Static/shared CMake installations and relocated C/C++ consumers
        if: ${{ !matrix.linux }}
        run: |
          python bindings/cpp/scripts/validate-install.py --library-dir "$GITHUB_WORKSPACE/$CARGO_TARGET_DIR/${{ matrix.target }}/release" --work-dir "$RUNNER_TEMP/cpp-validation"
      - name: Cross-language masks and artifact exchange
        if: ${{ !matrix.linux }}
        run: |
          EXE="$RUNNER_TEMP/cpp-validation/build-static/glrmask_cpp_tests"
          if [ "$RUNNER_OS" = Windows ]; then EXE="$EXE.exe"; fi
          node bindings/node/scripts/parity.cjs "$EXE" "$RUNNER_TEMP/native-parity"
      - name: Build self-contained C++ archives
        if: ${{ !matrix.linux }}
        run: python bindings/ci/package.py --install-work "$RUNNER_TEMP/cpp-validation" --platform '${{ matrix.tag }}' --output "$RUNNER_TEMP/cpp-packages"
      - name: Node 22 ABI compatibility
        if: ${{ !matrix.linux }}
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run same native binary on Node 22
        if: ${{ !matrix.linux }}
        working-directory: bindings/node
        run: npm test
      - name: Node 26 ABI compatibility
        if: ${{ !matrix.linux }}
        uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Run same native binary on Node 26
        if: ${{ !matrix.linux }}
        working-directory: bindings/node
        run: npm test
      - uses: actions/upload-artifact@v6
        with:
          name: node-native-${{ matrix.tag }}
          path: |
            bindings/node/glrmask.${{ matrix.tag }}.node
            bindings/node/native-manifest.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: cpp-native-${{ matrix.tag }}
          path: ${{ runner.temp }}/cpp-packages/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-evidence-${{ matrix.tag }}
          path: |
            ${{ runner.temp }}/cpp-validation/report.json
            ${{ runner.temp }}/cpp-validation/**/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/cpp-validation/**/failure-backtrace.txt
            ${{ runner.temp }}/native-parity/parity-report.json
            ${{ runner.temp }}/node-consumer/verification.json
            ${{ runner.temp }}/platform-install-report.json
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Stage and install thin root plus platform npm packages
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          pattern: node-native-*
          path: native-input
      - name: Stage checksummed platform packages and thin root
        run: |
          npm ci --omit=optional --ignore-scripts --prefix bindings/node
          node bindings/node/scripts/stage-platforms.cjs --input native-input --output npm-stage
          cp npm-stage/platform-manifest.json bindings/node/platform-manifest.json
          cd bindings/node
          node scripts/check-package.cjs --all
          for tag in win32-x64-msvc win32-arm64-msvc darwin-x64 darwin-arm64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl; do
            node scripts/check-package.cjs --platform-dir "$GITHUB_WORKSPACE/npm-stage/$tag" --tag "$tag"
          done
          mkdir -p "$GITHUB_WORKSPACE/npm-dist"
          npm pack --pack-destination "$GITHUB_WORKSPACE/npm-dist"
          for tag in win32-x64-msvc win32-arm64-msvc darwin-x64 darwin-arm64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl; do
            npm pack --pack-destination "$GITHUB_WORKSPACE/npm-dist" "$GITHUB_WORKSPACE/npm-stage/$tag"
          done
          ls "$GITHUB_WORKSPACE/npm-dist"
      - name: Install thin root with its platform package
        run: |
          cd bindings/node
          node scripts/test-installed.cjs "$GITHUB_WORKSPACE/npm-dist/glrmask-node-"[0-9]*.tgz \
            "$GITHUB_WORKSPACE/npm-dist/glrmask-node-linux-x64-gnu-"*.tgz "$RUNNER_TEMP/thin-consumer"
      - uses: actions/upload-artifact@v6
        with:
          name: glrmask-node-npm-dist
          path: npm-dist/*.tgz
          if-no-files-found: error
          retention-days: 14

  contracts:
    name: Rust public contracts and binding ABI
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Public lifecycle regression suites
        run: >-
          cargo test --locked --release -p glrmask --features internal-api
          --test core_batch --test final_public_api --test final_public_api_review
          --test prepared_components --test end_tokens --test token_range_bindings
          --test lark_compatibility --test marker_events --test marker_commit
          --test public_optimization_modes
      - name: Exact boundary metadata variants and deferred policy scoping
        run: cargo test --locked --release -p glrmask --features internal-api --lib public_api::final_boundary_option_tests
      - name: Linux tracing remains compatible with the glibc baseline
        run: cargo test --locked --release -p glrmask --lib native_thread_id_query_is_stable_and_thread_specific
      - name: Binding ownership and direct C ABI parity tests
        run: cargo test --locked --release -p glrmask-binding-core -p glrmask-c
      - name: Generated guides remain synchronized
        run: python scripts/sync-guide.py --check
