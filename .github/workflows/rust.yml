name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '3'
  CARGO_TARGET_DIR: target/rust-ci
  PYTHONUTF8: '1'
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install MSRV toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Check library and published helper crates
        run: >-
          cargo check --locked -p glrmask
          -p glrmask-artifact -p glrmask-dwa-merge -p glrmask-finite-automata
          -p glrmask-glr -p glrmask-grammar -p glrmask-invariant -p glrmask-json-schema
          -p glrmask-lexer -p glrmask-parser-dwa -p glrmask-terminal-dwa -p glrmask-vocab
          -p glrmask-weight -p glrmask-weighted-automata

  test:
    name: Library tests
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test with internal API
        run: cargo test --locked --profile fasttest -p glrmask -p glrmask-grammar --features internal-api

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
      - name: Clippy
        run: cargo clippy --workspace --all-targets --profile fasttest --exclude _glrmask --exclude glrmask-c --exclude glrmask-node --exclude glrmask-binding-core -- -D warnings

  examples:
    name: Examples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Generation example
        run: cargo run --locked --profile fasttest --example generate
      - name: Tool-call example
        run: cargo run --locked --profile fasttest --example tool_calls
      - name: Marker example
        run: cargo run --locked --profile fasttest --example markers
