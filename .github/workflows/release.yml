name: Trusted releases (npm, PyPI, crates.io, C++)

on:
  # Manual retry, used only to publish a validated tarball from a real release.
  # Run on a short-lived v*-prefixed recovery tag after the workflow fix lands.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the existing GitHub Release (e.g. 0.3.1)'
        required: true
        type: string
      source_run_id:
        description: 'Actions run ID for the published GitHub Release and its validated native artifacts'
        required: true
        type: string
      python_source_run_id:
        description: 'Optional, previously green Python wheel CI run for this exact release source tree'
        required: false
        type: string
      verify_crates_trust:
        description: 'Verify crates.io trusted publisher authentication only; upload nothing'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/native-bindings.yml'
      - '.github/workflows/python-wheels.yml'
      - 'scripts/check-release-version.py'
      - 'scripts/check-cpp-release-archives.py'
      - 'docs/releasing.md'
  release:
    types: [published]

# Publishing is enabled ONLY when a maintainer publishes a GitHub Release.
# No token or registry credentials are stored in this workflow.
permissions:
  contents: read

concurrency:
  group: trusted-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate release ref and versions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Metadata regression checks on pull requests (no publishing)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          python scripts/check-release-version.py --tag "v$VERSION" --skip-ancestry
          if python scripts/check-release-version.py --tag v999.0.0 --skip-ancestry; then
            echo 'Mismatched release version was erroneously accepted' >&2
            exit 1
          fi
          if python scripts/check-release-version.py --tag not-a-tag --skip-ancestry; then
            echo 'Invalid release tag was erroneously accepted' >&2
            exit 1
          fi
      - name: Require version-aligned tag on merged main
        id: versions
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check-release-version.py --tag "$RELEASE_TAG" --github-output

  native-build:
    name: Build and test all native C++/Node targets
    if: github.event_name == 'release'
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/native-bindings.yml

  python-build:
    name: Build and validate all Python distributions
    if: github.event_name == 'release'
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/python-wheels.yml

  npm:
    name: npm - @glrmask/node (platforms first, then thin root)
    if: github.event_name == 'release'
    needs: [verify, native-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: glrmask-node-npm-dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install OIDC-compatible npm
        run: npm install --global npm@12.2.0
      - name: Verify thin root and all eight platform tarballs
        shell: bash
        run: |
          set -euo pipefail
          ROOT_TGZ="dist/glrmask-node-${RELEASE_VERSION}.tgz"
          test -f "$ROOT_TGZ"
          PKG_JSON="$(tar -xOzf "$ROOT_TGZ" package/package.json)"
          test "$(printf '%s' "$PKG_JSON" | jq -r .name)" = '@glrmask/node'
          test "$(printf '%s' "$PKG_JSON" | jq -r .version)" = "$RELEASE_VERSION"
          # The thin root must not embed binaries or the retired fat manifest.
          if tar -tzf "$ROOT_TGZ" | grep -E 'package/glrmask\..+\.node|package/native-manifest\.json'; then
            echo 'Thin root must not contain native binaries or native-manifest.json' >&2
            exit 1
          fi
          tar -xOzf "$ROOT_TGZ" package/platform-manifest.json > /tmp/platform-manifest.json
          test "$(jq -r .version /tmp/platform-manifest.json)" = "$RELEASE_VERSION"
          test "$(jq -r '.targets | keys | length' /tmp/platform-manifest.json)" -eq 8
          for tag in win32-x64-msvc win32-arm64-msvc darwin-x64 darwin-arm64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl; do
            TGZ="dist/glrmask-node-${tag}-${RELEASE_VERSION}.tgz"
            test -f "$TGZ" || { echo "Missing platform tarball $TGZ" >&2; exit 1; }
            NAME="$(tar -xOzf "$TGZ" package/package.json | jq -r .name)"
            test "$NAME" = "@glrmask/node-${tag}"
            test "$(tar -xOzf "$TGZ" package/package.json | jq -r .version)" = "$RELEASE_VERSION"
            # Provenance: the binary inside the platform tarball must match the
            # size/sha256 recorded in the thin root's platform-manifest.json.
            EXPECTED_SIZE="$(jq -r ".targets[\"$tag\"].size" /tmp/platform-manifest.json)"
            EXPECTED_SHA="$(jq -r ".targets[\"$tag\"].sha256" /tmp/platform-manifest.json)"
            tar -xOzf "$TGZ" "package/glrmask.${tag}.node" > /tmp/check.node
            test "$(stat -c%s /tmp/check.node)" = "$EXPECTED_SIZE"
            test "$(sha256sum /tmp/check.node | cut -d' ' -f1)" = "$EXPECTED_SHA"
          done
          mkdir consumer
          printf '{"name":"release-smoke","version":"0.0.0","private":true}\n' > consumer/package.json
          cd consumer
          npm install --ignore-scripts --no-audit --no-fund --no-save \
            "../dist/glrmask-node-${RELEASE_VERSION}.tgz" \
            "../dist/glrmask-node-linux-x64-gnu-${RELEASE_VERSION}.tgz"
          node --input-type=module -e "import { Grammar, Vocab } from '@glrmask/node'; if (!Grammar || !Vocab) throw Error('Missing exports')"
      - name: Publish platforms first, then thin root (GitHub OIDC, no npm token)
        env:
          # Ensure an auth-free npmrc; npm automatically requests a GitHub OIDC
          # token using this job's id-token: write permission.
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/glrmask-oidc.npmrc
        shell: bash
        run: |
          set -euo pipefail
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          publish_with_retry() {
            local tgz="$1" attempts=0
            while [ "$attempts" -lt 3 ]; do
              attempts=$((attempts + 1))
              if npm publish "$tgz" --access public --registry=https://registry.npmjs.org/; then
                return 0
              fi
              echo "Publish attempt $attempts failed for $tgz; retrying in 30s" >&2
              sleep 30
            done
            echo "Publish failed three times for $tgz" >&2
            return 1
          }
          already_public() {
            npm view "$1@${RELEASE_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1
          }
          # Platform packages must be public before the thin root, so a fresh
          # `npm install @glrmask/node` resolves every optionalDependency.
          for tag in win32-x64-msvc win32-arm64-msvc darwin-x64 darwin-arm64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl; do
            NAME="@glrmask/node-${tag}"
            if already_public "$NAME"; then
              echo "Already published $NAME@${RELEASE_VERSION}; skipping."
            else
              publish_with_retry "./dist/glrmask-node-${tag}-${RELEASE_VERSION}.tgz"
            fi
          done
          if already_public '@glrmask/node'; then
            echo "Already released npm @glrmask/node@${RELEASE_VERSION}; no second publish."
          else
            publish_with_retry "./dist/glrmask-node-${RELEASE_VERSION}.tgz"
          fi

  pypi:
    name: PyPI - glrmask
    if: github.event_name == 'release'
    needs: [verify, python-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-release-artifacts
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate distributions are for the requested release
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -type f -name '*.whl' | wc -l)" -eq 8
          test "$(find dist -type f -name '*.tar.gz' | wc -l)" -eq 1
          find dist -type f | while IFS= read -r file; do
            test "$(basename "$file" | grep -c "$RELEASE_VERSION")" -eq 1
          done
      - name: Check PyPI release status
        id: existing
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          version = os.environ['RELEASE_VERSION']
          url = f'https://pypi.org/pypi/glrmask/{version}/json'
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  if response.status != 200: raise RuntimeError('Unexpected PyPI response')
                  exists = True
          except urllib.error.HTTPError as exc:
              if exc.code != 404: raise
              exists = False
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'exists={str(exists).lower()}\n')
          print(f'PyPI glrmask {version} already exists: {exists}')
          PY
      - name: Publish to PyPI using GitHub OIDC
        if: steps.existing.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    name: crates.io - glrmask root crate
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check crates.io published versions
        id: existing
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          version=os.environ['RELEASE_VERSION']
          url=f'https://crates.io/api/v1/crates/glrmask/{version}'
          req=urllib.request.Request(url, headers={'User-Agent':'GLRMask-release-workflow/1.0 (https://github.com/IsaacBreen/glrmask)'})
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status != 200: raise RuntimeError('Unexpected crates.io response')
                  exists=True
          except urllib.error.HTTPError as exc:
              if exc.code != 404: raise
              exists=False
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'exists={str(exists).lower()}\n')
          print(f'crates.io glrmask {version} already exists: {exists}')
          PY
      - name: Install stable Rust toolchain
        if: steps.existing.outputs.exists == 'false'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Validate root crate publication
        if: steps.existing.outputs.exists == 'false'
        run: cargo publish --locked --dry-run -p glrmask
      - name: Exchange GitHub OIDC for short-lived crates.io credential
        if: steps.existing.outputs.exists == 'false'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish root crate
        if: steps.existing.outputs.exists == 'false'
        run: cargo publish --locked -p glrmask
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  cpp:
    name: GitHub Release - C/C++ static and shared libraries
    if: github.event_name == 'release'
    needs: [verify, native-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: cpp-native-*
          path: dist/cpp
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify every archive and matching CMake installation manifest
        run: python scripts/check-cpp-release-archives.py dist/cpp "$RELEASE_VERSION"
      - name: Upload matching C++ release assets without overwriting prior assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          tag=os.environ['RELEASE_TAG']
          # GitHub's REST release asset objects include sha256 digests; the
          # gh release view --json assets projection does not expose them.
          existing=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{tag}'],
              text=True))['assets']
          asset_by_name={item['name']:item for item in existing}
          archives=sorted(pathlib.Path('dist/cpp').rglob('*.tar.gz'))
          if len(archives) != 16: raise RuntimeError(f'Expected exactly 16 C++ release archives, got {len(archives)}')
          for archive in archives:
              name=archive.name
              digest='sha256:'+hashlib.sha256(archive.read_bytes()).hexdigest()
              if name in asset_by_name:
                  recorded=asset_by_name[name].get('digest')
                  if recorded != digest:
                      raise RuntimeError(f'Existing release asset differs or lacks digest: {name}')
                  print(f'Already uploaded with matching checksum: {name}')
                  continue
              subprocess.run(['gh','release','upload',tag,str(archive)],check=True)
              print(f'Uploaded verified asset: {name}')
          PY

  npm-recovery:
    name: npm - recover vetted release via trusted publishing
    if: github.event_name == 'workflow_dispatch' && inputs.python_source_run_id == '' && !inputs.verify_crates_trust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_RUN_ID: ${{ inputs.source_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require an existing approved GitHub Release and its exact CI run
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]+$ ]]
          python scripts/check-release-version.py --tag "v${RELEASE_VERSION}" --skip-ancestry
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}")"
          printf '%s' "$RELEASE_JSON" | jq -e '.draft == false and .prerelease == false' > /dev/null
          RELEASE_COMMIT="$(printf '%s' "$RELEASE_JSON" | jq -r .target_commitish)"
          TAG_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${RELEASE_VERSION}" --jq .object.sha)"
          test "$RELEASE_COMMIT" = "$TAG_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          test "$(printf '%s' "$RUN_JSON" | jq -r .head_sha)" = "$RELEASE_COMMIT"
          test "$(printf '%s' "$RUN_JSON" | jq -r .event)" = release
          test "$(printf '%s' "$RUN_JSON" | jq -r .name)" = 'Trusted releases (npm, PyPI, crates.io, C++)'
          echo "Valid existing release v${RELEASE_VERSION}; native archive from Actions run ${RELEASE_RUN_ID}"
      - uses: actions/download-artifact@v7
        with:
          name: glrmask-node-npm-dist
          path: dist
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install OIDC-compatible npm
        run: npm install --global npm@12.2.0
      - name: Validate thin root and all eight platform tarballs
        shell: bash
        run: |
          set -euo pipefail
          ROOT_TGZ="dist/glrmask-node-${RELEASE_VERSION}.tgz"
          test -f "$ROOT_TGZ"
          PKG_JSON="$(tar -xOzf "$ROOT_TGZ" package/package.json)"
          test "$(printf '%s' "$PKG_JSON" | jq -r .name)" = '@glrmask/node'
          test "$(printf '%s' "$PKG_JSON" | jq -r .version)" = "$RELEASE_VERSION"
          if tar -tzf "$ROOT_TGZ" | grep -E 'package/glrmask\..+\.node|package/native-manifest\.json'; then
            echo 'Thin root must not contain native binaries or native-manifest.json' >&2
            exit 1
          fi
          tar -xOzf "$ROOT_TGZ" package/platform-manifest.json > /tmp/platform-manifest.json
          test "$(jq -r '.targets | keys | length' /tmp/platform-manifest.json)" -eq 8
          for tag in win32-x64-msvc win32-arm64-msvc darwin-x64 darwin-arm64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl; do
            TGZ="dist/glrmask-node-${tag}-${RELEASE_VERSION}.tgz"
            test -f "$TGZ" || { echo "Missing platform tarball $TGZ" >&2; exit 1; }
            test "$(tar -xOzf "$TGZ" package/package.json | jq -r .name)" = "@glrmask/node-${tag}"
            test "$(tar -xOzf "$TGZ" package/package.json | jq -r .version)" = "$RELEASE_VERSION"
          done
          mkdir consumer
          printf '{"name":"release-smoke","version":"0.0.0","private":true}\n' > consumer/package.json
          cd consumer
          npm install --ignore-scripts --no-audit --no-fund --no-save \
            "../dist/glrmask-node-${RELEASE_VERSION}.tgz" \
            "../dist/glrmask-node-linux-x64-gnu-${RELEASE_VERSION}.tgz"
          node --input-type=module -e "import { Grammar, Vocab } from '@glrmask/node'; if (!Grammar || !Vocab) throw Error('Missing exports')"
      - name: Publish vetted platforms first, then thin root, using GitHub OIDC
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/glrmask-oidc.npmrc
        shell: bash
        run: |
          set -euo pipefail
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          publish_with_retry() {
            local tgz="$1" attempts=0
            while [ "$attempts" -lt 3 ]; do
              attempts=$((attempts + 1))
              if npm publish "$tgz" --access public --registry=https://registry.npmjs.org/; then
                return 0
              fi
              echo "Publish attempt $attempts failed for $tgz; retrying in 30s" >&2
              sleep 30
            done
            echo "Publish failed three times for $tgz" >&2
            return 1
          }
          already_public() {
            npm view "$1@${RELEASE_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1
          }
          for tag in win32-x64-msvc win32-arm64-msvc darwin-x64 darwin-arm64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl; do
            NAME="@glrmask/node-${tag}"
            if already_public "$NAME"; then
              echo "Already published $NAME@${RELEASE_VERSION}; skipping."
            else
              publish_with_retry "./dist/glrmask-node-${tag}-${RELEASE_VERSION}.tgz"
            fi
          done
          if already_public '@glrmask/node'; then
            echo "Already published @glrmask/node@${RELEASE_VERSION}"
          else
            publish_with_retry "./dist/glrmask-node-${RELEASE_VERSION}.tgz"
          fi

  pypi-recovery:
    name: PyPI - recover exactly source-matched validated wheels
    if: github.event_name == 'workflow_dispatch' && inputs.python_source_run_id != '' && !inputs.verify_crates_trust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PYTHON_SOURCE_RUN_ID: ${{ inputs.python_source_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify published release, successful wheel CI and exact source-tree identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          [[ "$PYTHON_SOURCE_RUN_ID" =~ ^[1-9][0-9]+$ ]]
          python scripts/check-release-version.py --tag "v${RELEASE_VERSION}" --skip-ancestry
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}")"
          printf '%s' "$RELEASE_JSON" | jq -e '.draft == false and .prerelease == false' > /dev/null
          RELEASE_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${RELEASE_VERSION}" --jq .object.sha)"
          test "$(printf '%s' "$RELEASE_JSON" | jq -r .target_commitish)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PYTHON_SOURCE_RUN_ID}")"
          test "$(printf '%s' "$RUN_JSON" | jq -r .name)" = 'Python wheels'
          test "$(printf '%s' "$RUN_JSON" | jq -r .event)" = pull_request
          test "$(printf '%s' "$RUN_JSON" | jq -r .status)" = completed
          test "$(printf '%s' "$RUN_JSON" | jq -r .conclusion)" = success
          test "$(printf '%s' "$RUN_JSON" | jq -r .repository.full_name)" = "$GITHUB_REPOSITORY"
          SOURCE_COMMIT="$(printf '%s' "$RUN_JSON" | jq -r .head_sha)"
          RELEASE_TREE="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${RELEASE_COMMIT}" --jq .tree.sha)"
          SOURCE_TREE="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${SOURCE_COMMIT}" --jq .tree.sha)"
          test "$SOURCE_TREE" = "$RELEASE_TREE"
          echo "Exact source-tree match: ${SOURCE_TREE}"
      - uses: actions/download-artifact@v7
        with:
          name: python-release-artifacts
          path: dist
          run-id: ${{ inputs.python_source_run_id }}
          github-token: ${{ github.token }}
      - name: Validate package set and all distribution versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -type f -name '*.whl' | wc -l)" -eq 8
          test "$(find dist -type f -name '*.tar.gz' | wc -l)" -eq 1
          find dist -type f | while IFS= read -r file; do
            test "$(basename "$file" | grep -c "${RELEASE_VERSION}")" -eq 1
          done
          python -m pip install --upgrade pip twine packaging
          python -m twine check dist/*
          python scripts/check-python-wheel-set.py dist
      - name: Check existing PyPI version
        id: exists
        shell: bash
        run: |
          python - <<'PY'
          import os,urllib.error,urllib.request
          u=f'https://pypi.org/pypi/glrmask/{os.environ["RELEASE_VERSION"]}/json'
          try:
              with urllib.request.urlopen(u,timeout=20) as r:
                  if r.status!=200: raise RuntimeError('Unexpected PyPI response')
                  exists=True
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
              exists=False
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'skip={str(exists).lower()}\n')
          print('Already published:',exists)
          PY
      - name: Publish approved wheel set using GitHub OIDC
        if: steps.exists.outputs.skip == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1


  crates-trust-check:
    name: crates.io - verify trusted publishing without publishing
    if: github.event_name == 'workflow_dispatch' && inputs.verify_crates_trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Exchange GitHub OIDC for a temporary crates.io publish credential
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Confirm trusted publishing authentication
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN"
          echo 'crates.io OIDC trusted publisher successfully authenticated; no package uploaded'
      # The action's post hook revokes the temporary credential.
