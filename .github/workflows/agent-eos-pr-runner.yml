name: Temporary EOS grammar validation runner

on:
  pull_request:
    branches:
      - agent/eos-grammar-runner
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Verify no EOS runtime metadata remains
        run: |
          ! grep -R -n -E 'eos_token_id|EOS_BYTES|update_eos_mask|finalize_eos_ns|eos_allowed' --include='*.rs' --exclude-dir=.git --exclude-dir=target .
      - name: Check workspace libraries and binaries
        run: cargo check --workspace
      - name: Test compiler crate
        run: cargo test -p glrmask
      - name: Test runtime integration boundary
        run: cargo test -p glrmask-runtime --test runtime_session
