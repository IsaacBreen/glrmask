name: Python wheels

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/python-wheels.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "python/**"
      - "scripts/check-python-wheel-set.py"
      - "scripts/check-readme-archives.py"
      - "scripts/python-artifact-smoke.py"
      - "scripts/python-wheel-smoke.py"
      - "src/**"
      - "crates/**"
  # Versioned GitHub Release publication calls this workflow via workflow_call.
  # Do not rebuild wheels on every tag push (including recovery/validation
  # tags); tag creation alone is not a publication event.

permissions:
  contents: read

concurrency:
  group: python-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheels:
    name: ${{ matrix.platform.id }} (abi3)
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: manylinux-x86_64
            runner: ubuntu-24.04
            target: x86_64
            python-arch: x64
            linux: true
            musl: false
            manylinux: "2014"
            container: quay.io/pypa/manylinux2014_x86_64:latest
          - id: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            python-arch: arm64
            linux: true
            musl: false
            manylinux: "2014"
            container: quay.io/pypa/manylinux2014_aarch64:latest
          - id: musllinux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            python-arch: x64
            linux: true
            musl: true
            manylinux: "musllinux_1_2"
            container: quay.io/pypa/musllinux_1_2_x86_64:latest
          - id: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            python-arch: arm64
            linux: true
            musl: true
            manylinux: "musllinux_1_2"
            container: quay.io/pypa/musllinux_1_2_aarch64:latest
          - id: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            python-arch: x64
            linux: false
            musl: false
          - id: macos-arm64
            runner: macos-15
            target: aarch64
            python-arch: arm64
            linux: false
            musl: false
          - id: windows-x86_64
            runner: windows-latest
            target: x64
            python-arch: x64
            linux: false
          - id: windows-arm64
            runner: windows-11-arm
            target: arm64
            python-arch: arm64
            linux: false

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python-arch }}

      - name: Build Linux wheel
        if: ${{ matrix.platform.linux }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ matrix.platform.container }}
          args: >-
            --release
            --locked
            --out dist
            -i python3.12
            --compatibility pypi
            --manifest-path python/Cargo.toml

      - name: Build native wheel
        if: ${{ !matrix.platform.linux }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --locked
            --compatibility pypi
            --out dist
            --interpreter python
            --manifest-path python/Cargo.toml

      - name: Validate wheel metadata
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*

      - name: Clean-install and smoke-test wheel (Python 3.12, musl)
        if: ${{ matrix.platform.musl }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/io" -w /io "${{ matrix.platform.container }}" \
            /opt/python/cp312-cp312/bin/python scripts/python-artifact-smoke.py dist --kind wheel

      - name: Clean-install and smoke-test wheel (Python 3.12, standard)
        if: ${{ !matrix.platform.musl }}
        run: python scripts/python-artifact-smoke.py dist --kind wheel

      - name: Setup Python 3.9 for ABI verification
        if: ${{ !matrix.platform.linux && matrix.platform.id != 'windows-arm64' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: ${{ matrix.platform.python-arch }}

      - name: Clean-install and smoke-test wheel (Python 3.9)
        if: ${{ !matrix.platform.linux && matrix.platform.id != 'windows-arm64' }}
        run: python scripts/python-artifact-smoke.py dist --kind wheel

      - name: Setup Python 3.14 for ABI verification
        if: ${{ !matrix.platform.linux }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: ${{ matrix.platform.python-arch }}

      - name: Clean-install and smoke-test wheel (Python 3.14)
        if: ${{ !matrix.platform.linux }}
        run: python scripts/python-artifact-smoke.py dist --kind wheel

      - name: Setup Python 3.15 for ABI verification
        if: ${{ !matrix.platform.linux }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          architecture: ${{ matrix.platform.python-arch }}

      - name: Clean-install and smoke-test wheel (Python 3.15)
        if: ${{ !matrix.platform.linux }}
        run: python scripts/python-artifact-smoke.py dist --kind wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.platform.id }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml

      - name: Validate sdist metadata
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*

      - name: Clean-install and smoke-test sdist
        run: |
          python scripts/check-readme-archives.py --sdist dist/*.tar.gz
          python scripts/python-artifact-smoke.py dist --kind sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v6
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  validate-artifact-set:
    name: Validate complete artifact set
    runs-on: ubuntu-24.04
    needs: [wheels, sdist]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: python-sdist
          path: dist

      - name: Validate complete release-shaped artifact set
        run: |
          python -m pip install --upgrade pip twine packaging
          python -m twine check dist/*
          python scripts/check-python-wheel-set.py dist

      - name: Upload combined validated artifact set
        uses: actions/upload-artifact@v6
        with:
          name: python-release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 14
