name: Python wheels
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full-installed-api:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: wheel-macos-arm64
          run-id: 39211399501
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: wheels
      - name: Install and test complete API using the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -I -m pip install wheels/*.whl pytest
          "$RUNNER_TEMP/consumer/bin/python" -I -c 'import glrmask;print(glrmask.__file__)'
          "$RUNNER_TEMP/consumer/bin/python" -I -X faulthandler -m pytest -q -p no:cacheprovider python/tests
  musl-thread-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheel-musllinux-x86_64
          run-id: 39211399501
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: wheels
      - name: Diagnose default and larger worker stacks with the existing wheel
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/io" -v "$RUNNER_TEMP:/evidence" -w /io \
            quay.io/pypa/musllinux_1_2_x86_64:latest bash -lc '
              set -eu
              apk add --no-cache gdb
              /opt/python/cp39-cp39/bin/python -m venv /tmp/consumer
              /tmp/consumer/bin/python -I -m pip install /io/wheels/*.whl pytest
              set +e
              /tmp/consumer/bin/python -I -X faulthandler /io/scripts/musl-python-thread-probe.py 1048576 > /evidence/python-large-stack.txt 2>&1
              echo "large_stack_exit=$?" >> /evidence/python-large-stack.txt
              /tmp/consumer/bin/python -I -X faulthandler /io/scripts/musl-python-thread-probe.py 0 > /evidence/python-default-stack.txt 2>&1
              echo "default_stack_exit=$?" >> /evidence/python-default-stack.txt
              gdb --batch -ex "set pagination off" -ex run -ex "info registers sp" -ex "x/i \$pc" -ex "info proc mappings" -ex "thread apply all bt 30" --args /tmp/consumer/bin/python -I -X faulthandler /io/scripts/musl-python-thread-probe.py 0 > /evidence/python-backtrace.txt 2>&1
              cat /evidence/python-large-stack.txt /evidence/python-default-stack.txt
            '
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: musl-python-thread-diagnostic
          path: |
            ${{ runner.temp }}/python-*-stack.txt
            ${{ runner.temp }}/python-backtrace.txt
          if-no-files-found: error
