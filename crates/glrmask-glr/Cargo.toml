[package]
name = "glrmask-glr"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Part of GLRMask: GLR tables and parsing. Depend on the glrmask crate instead; this crate has no stable API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[features]
default = []
internal-api = []
# Runs tests that take over ~10 s; they are ignored by default.
slow-tests = []

[dependencies]
glrmask-invariant = { version = "=0.2.0", path = "../glrmask-invariant", features = ["internal-api"] }
glrmask-grammar = { version = "=0.3.0", path = "../glrmask-grammar", features = ["internal-api"] }
glrmask-lexer = { version = "=0.3.0", path = "../glrmask-lexer", features = ["internal-api"] }
glrmask-weight = { version = "=0.3.0", path = "../glrmask-weight" }
im = "15"
rayon = "1"
rustc-hash = "1"
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
smallvec = { version = "1", features = ["serde"] }

[dev-dependencies]
bincode = "1"

[lints]
workspace = true
