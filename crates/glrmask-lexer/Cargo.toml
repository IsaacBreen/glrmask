[package]
name = "glrmask-lexer"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "Part of GLRMask: lexer automata. Depend on the glrmask crate instead; this crate has no stable API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[features]
default = []
internal-api = []
# Runs tests that take over ~10 s; they are ignored by default.
slow-tests = []

[dependencies]
bincode = "1"
glrmask-finite-automata = { version = "=0.1.2", path = "../glrmask-finite-automata" }
glrmask-vocab = { version = "=0.2.1", path = "../glrmask-vocab", features = ["internal-api"] }
rayon = "1"
range-set-blaze = "0.8.0"
regex-syntax = "0.8"
rustc-hash = "1"
serde = { version = "1", features = ["derive", "rc"] }
smallvec = { version = "1", features = ["serde"] }

[dev-dependencies]
rand = "0.8"

[lints]
workspace = true
