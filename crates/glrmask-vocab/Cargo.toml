[package]
name = "glrmask-vocab"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "Part of GLRMask: vocabularies and token sets. Depend on the glrmask crate instead; this crate has no stable API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[features]
default = []
internal-api = []

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
range-set-blaze = "0.8.0"

[lints]
workspace = true
