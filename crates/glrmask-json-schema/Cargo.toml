[package]
name = "glrmask-json-schema"
version = "0.1.1"
edition = "2024"
description = "JSON Schema to grammar lowering for GLRMask"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[dependencies]
derivre = { version = "=0.3.8", default-features = false, features = ["compress"] }
glrmask-grammar = { version = "=0.1.1", path = "../glrmask-grammar" }
glrmask-lexer = { version = "=0.1.1", path = "../glrmask-lexer" }
rayon = "1"
regex = "1"
regex-syntax = "0.8"
rustc-hash = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
