[package]
name = "glrmask-dwa-merge"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Part of GLRMask: weighted-DWA merging. Depend on the glrmask crate instead; this crate has no stable API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[features]
default = []
internal-api = []

[dependencies]
glrmask-artifact = { version = "=0.2.1", path = "../glrmask-artifact", features = ["internal-api"] }
glrmask-glr = { version = "=0.2.1", path = "../glrmask-glr", features = ["internal-api"] }
glrmask-invariant = { version = "=0.1.2", path = "../glrmask-invariant", features = ["internal-api"] }
glrmask-weight = { version = "=0.2.0", path = "../glrmask-weight", features = ["internal-api"] }
glrmask-weighted-automata = { version = "=0.2.0", path = "../glrmask-weighted-automata" }
range-set-blaze = "0.3.0"
rustc-hash = "1"
smallvec = { version = "1", features = ["serde"] }

[lints]
workspace = true
