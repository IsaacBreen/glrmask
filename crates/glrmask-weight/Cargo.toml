[package]
name = "glrmask-weight"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Part of GLRMask: token-set weights. Depend on the glrmask crate instead; this crate has no stable API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[features]
default = []
internal-api = []

[dependencies]
dashmap = "6"
once_cell = "1"
range-set-blaze = "0.3.0"
rayon = "1"
rustc-hash = "1"
serde = { version = "1", features = ["derive", "rc"] }
smallvec = { version = "1", features = ["serde"] }

[dev-dependencies]
bincode = "1"
