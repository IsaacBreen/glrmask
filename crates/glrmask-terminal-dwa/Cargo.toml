[package]
name = "glrmask-terminal-dwa"
version = "0.1.1"
edition = "2024"
description = "Vocabulary and lexer to terminal-DWA compiler for GLRMask"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[features]
default = []
facade-tests = []

[dependencies]
ahash = "0.8"
blake3 = "1"
glrmask-artifact = { version = "=0.1.1", path = "../glrmask-artifact" }
glrmask-finite-automata = { version = "=0.1.1", path = "../glrmask-finite-automata" }
glrmask-dwa-merge = { version = "=0.1.1", path = "../glrmask-dwa-merge" }
glrmask-glr = { version = "=0.1.1", path = "../glrmask-glr" }
glrmask-grammar = { version = "=0.1.1", path = "../glrmask-grammar" }
glrmask-invariant = { version = "=0.1.1", path = "../glrmask-invariant" }
glrmask-lexer = { version = "=0.1.1", path = "../glrmask-lexer" }
glrmask-vocab = { version = "=0.1.1", path = "../glrmask-vocab" }
glrmask-weight = { version = "=0.1.1", path = "../glrmask-weight" }
glrmask-weighted-automata = { version = "=0.1.1", path = "../glrmask-weighted-automata" }
hashbrown = "0.15"
once_cell = "1"
range-set-blaze = "0.3.0"
rayon = "1"
rustc-hash = "1"
smallvec = { version = "1", features = ["serde"] }
thiserror = "1"
