[package]
name = "glrmask-finite-automata"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "Part of GLRMask: finite automata. Depend on the glrmask crate instead; this crate has no stable API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[dependencies]
glrmask-invariant = { version = "=0.1.2", path = "../glrmask-invariant", features = ["internal-api"] }
rustc-hash = "1"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
