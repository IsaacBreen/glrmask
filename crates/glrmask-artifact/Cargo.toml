[package]
name = "glrmask-artifact"
version = "0.1.1"
edition = "2024"
description = "Mapped compiled-artifact and tokenizer-ID representations for GLRMask"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[dependencies]
