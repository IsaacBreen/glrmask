[package]
name = "glrmask-artifact"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Part of GLRMask: compiled-artifact layouts. Depend on the glrmask crate instead; this crate has no stable API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[features]
default = []
internal-api = []

[dependencies]
glrmask-finite-automata = { version = "=0.1.2", path = "../glrmask-finite-automata" }
glrmask-weight = { version = "=0.2.0", path = "../glrmask-weight", features = ["internal-api"] }
glrmask-weighted-automata = { version = "=0.2.0", path = "../glrmask-weighted-automata" }
range-set-blaze = "0.3.0"
rayon = "1"
rustc-hash = "1"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
