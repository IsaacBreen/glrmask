[package]
name = "glrmask-grammar"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Part of GLRMask: grammars and the Lark and GLRM front ends. Depend on the glrmask crate instead; this crate has no stable API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsaacBreen/glrmask"

[features]
default = []
internal-api = []

[dependencies]
glrmask-finite-automata = { version = "=0.2.0", path = "../glrmask-finite-automata" }
glrmask-lexer = { version = "=0.3.0", path = "../glrmask-lexer", features = ["internal-api"] }
rayon = "1"
rustc-hash = "1"
range-set-blaze = "0.8.0"
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
