[package]
name = "_glrmask"
version = "0.3.1"
edition = "2021"

[lib]
name = "_glrmask"
crate-type = ["cdylib"]
doc = false


[features]
default = []
allocation-tracking = []

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py39"] }
numpy = "0.29.0"
glrmask = { path = "..", features = ["internal-api"] }
self_cell = "1"
mimalloc = "=0.1.52"
libmimalloc-sys = { version = "=0.1.49", default-features = false, features = ["extended"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Python imports the extension after process startup. musl cannot safely use
# the allocator's initial-exec TLS assumptions in a dynamically loaded module.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "=0.1.52", features = ["local_dynamic_tls"] }
