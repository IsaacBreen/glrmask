# Older supported Rust toolchains can misalign a stripped Mach-O string pool,
# which prevents Python from loading the extension on macOS 27. This affects
# the final language-binding shared libraries, not runtime artifacts or native
# benchmarks. The same issue affects C and Node images and debug=0 dev builds:
# implicit strip=debuginfo can produce LC_SYMTAB.stroff % 8 == 4.
# Upstream tracking: https://github.com/rust-lang/rust/issues/157750
[profile.release.package._glrmask]
strip = "none"

[profile.release.package.glrmask-c]
strip = "none"

[profile.release.package.glrmask-node]
strip = "none"

[profile.dev.package._glrmask]
strip = "none"

[profile.dev.package.glrmask-c]
strip = "none"

[profile.dev.package.glrmask-node]
strip = "none"

