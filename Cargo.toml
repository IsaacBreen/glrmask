[package]
name = "glrmask"
version = "1.0.0"
edition = "2024"
autotests = false
description = "Extremely fast grammar-constrained decoding for LLMs"
license = "MIT OR Apache-2.0"
readme = "README.rust.md"
documentation = "https://docs.rs/glrmask"
repository = "https://github.com/IsaacBreen/glrmask"
keywords = ["grammar", "llm", "decoding", "parser", "json-schema"]
categories = ["algorithms", "parsing"]
exclude = [
    ".agents/**",
    ".github/**",
    "AGENTS.md",
    "CORE-API.md",
    "CORE-PROGRESS.md",
    "docs/validation/**",
    ".benchmarks/**",
    ".cache/**",
    "python/**",
    "bindings/**",
    "scripts/**",
    "target/**",
]

[features]
default = []
internal-api = []
# Runs tests that take over ~10 s; they are ignored by default.
slow-tests = [
    "glrmask-glr/slow-tests",
    "glrmask-lexer/slow-tests",
    "glrmask-parser-dwa/slow-tests",
    "glrmask-terminal-dwa/slow-tests",
]

[[example]]
name = "composition_component_candidates"
required-features = ["internal-api"]

[dependencies]
glrmask-finite-automata = { version = "=0.1.2", path = "crates/glrmask-finite-automata" }
glrmask-weight = { version = "=0.1.1", path = "crates/glrmask-weight", features = ["internal-api"] }
glrmask-weighted-automata = { version = "=0.1.1", path = "crates/glrmask-weighted-automata" }
glrmask-vocab = { version = "=0.2.1", path = "crates/glrmask-vocab", features = ["internal-api"] }
glrmask-lexer = { version = "=0.2.1", path = "crates/glrmask-lexer", features = ["internal-api"] }
glrmask-grammar = { version = "=0.2.1", path = "crates/glrmask-grammar", features = ["internal-api"] }
glrmask-glr = { version = "=0.2.1", path = "crates/glrmask-glr", features = ["internal-api"] }
glrmask-json-schema = { version = "=0.2.1", path = "crates/glrmask-json-schema", features = ["internal-api"] }
glrmask-artifact = { version = "=0.2.1", path = "crates/glrmask-artifact", features = ["internal-api"] }
glrmask-invariant = { version = "=0.1.2", path = "crates/glrmask-invariant", features = ["internal-api"] }
glrmask-terminal-dwa = { version = "=0.2.1", path = "crates/glrmask-terminal-dwa", features = ["internal-api"] }
glrmask-parser-dwa = { version = "=0.2.1", path = "crates/glrmask-parser-dwa", features = ["internal-api"] }
rustc-hash = "1"
ahash = "0.8"
smallvec = { version = "1", features = ["serde"] }
im = "15"
range-set-blaze = "0.3.0"
hashbrown = "0.15"
once_cell = "1"
blake3 = "1"

serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
zstd = { version = "0.13", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
regex-syntax = "0.8"
derivre = { version = "=0.3.8", default-features = false, features = ["compress"] }

rayon = "1"
stacker = "0.1"
dashmap = "6"
rand = "0.8"
thiserror = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1"
# Enable the unstable bridge only while building this package's tests,
# examples, and benchmarks. Normal dependency builds keep the narrow API.
glrmask_internal_dev = { package = "glrmask", path = ".", features = ["internal-api"] }

[[bench]]
name = "cfa_sweep_schema_build_single_threaded"
harness = false

[[bench]]
name = "cfa_sweep_schema_build_multithreaded"
harness = false

[[bench]]
name = "bounded_string_array_close"
harness = false

[[example]]
name = "profile_glr"

[[example]]
name = "selected10_programmatic_tools"
required-features = ["internal-api"]

