[[test]]
name = "snowplow_hostname_replay_mre"
path = "tests/regressions/replay/snowplow_hostname.rs"

[workspace]
members = [
    ".",
    "python",
    "bindings/core",
    "bindings/cpp",
    "bindings/node",
    "crates/glrmask-finite-automata",
    "crates/glrmask-weight",
    "crates/glrmask-weighted-automata",
    "crates/glrmask-vocab",
    "crates/glrmask-lexer",
    "crates/glrmask-grammar",
    "crates/glrmask-glr",
    "crates/glrmask-json-schema",
    "crates/glrmask-artifact",
    "crates/glrmask-invariant",
    "crates/glrmask-terminal-dwa",
    "crates/glrmask-parser-dwa",
    "crates/glrmask-dwa-merge",
]
resolver = "2"

# An owned incremental development loop for the native language bindings.
# This does not change normal library or production-release optimization.
[profile.bindings-dev]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true
codegen-units = 256

# An optimized, incremental profile for the local test loop
# (`cargo test --profile fasttest`). Release builds are unchanged.
[profile.fasttest]
inherits = "release"
opt-level = 2
debug = 0
incremental = true
codegen-units = 256

